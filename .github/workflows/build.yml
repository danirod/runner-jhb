name: build
on:
  push:
jobs:
  macos:
    strategy:
      matrix:
        platform:
          - runs-on: macos-15-intel
            name: x64
          - runs-on: macos-26
            name: arm64
      fail-fast: false
    name: "build ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      WRK_DIR: /Users/Shared/work
      CCACHE_DIR: /Users/Shared/work/ccache
    steps:
    - name: clone
      uses: actions/checkout@v4
    - name: timestamp
      id: timestamp
      uses: josStorer/get-current-time@v2
      with:
        format: "YYYY-MM-DD-HH-mm-ss"
    - name: cache
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-jhb-${{ matrix.platform.name }}-${{ steps.timestamp.outputs.formattedTime }}
        restore-keys: ccache-jhb-${{ matrix.platform.name }}-
    - name: build
      run: |
        git clone https://gitlab.com/dehesselle/jhb
        cd jhb
        git checkout $(git tag | grep "^v" | sort -V | tail -1)
        git submodule update --init --recursive
        git apply < ../0001-meson-184.patch
        export MACOSX_DEPLOYMENT_TARGET=11.0
        export FORCE_BUILD_FROM_SOURCE=true
        export VERSION="1.3+meson184"
        usr/bin/bootstrap
        usr/bin/archive remove_nonessentials
        usr/bin/archive create_tar
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: jhb
        path: jhb/jhb*.tar.xz
