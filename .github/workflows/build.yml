# This is a basic workflow to help you get started with Actions

name: build

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  macos:
    strategy:
      matrix:
        platform:
          - runs-on: macos-14
            name: x64
          - runs-on: macos-15
            name: arm64
      fail-fast: false
    name: "build ${{ matrix.platform.name }}"
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
    - run: |
       git clone https://github.com/dehesselle/jhb
       cd jhb
       git checkout $(git tag | grep "^v" | sort -V | tail -1)
       git submodule update --init --recursive
       sed -i 's/meson==1.8.2/meson==1.8.4/' etc/jhb.conf.d/jhbuild.sh
       export MACOSX_DEPLOYMENT_TARGET=11.0
       export FORCE_BUILD_FROM_SOURCE=true
       export VERSION="1.3+meson184"
       usr/bin/bootstrap
